<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 15 - Tags</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Task 15 - Tags</h1>
    <h2>Add an item</h2>
    <form id="addForm">
        <input type="text" id="text" placeholder="Your text" required>
        <select id="type">
            <option value="note">note</option>
            <option value="email">email</option>
            <option value="todo">todo</option>
        </select>
        <button type="submit">Add</button>
    </form>
    <h2>Search</h2>
    <form id="searchForm">
        <fieldset>
            <legend>Types (none checked = all)</legend>
            <label><input type="checkbox" name="types" value="note"> note</label>
            <label><input type="checkbox" name="types" value="email"> email</label>
            <label><input type="checkbox" name="types" value="todo"> todo</label>
        </fieldset>
        <select id="searchMode">
            <option value="with">containing</option>
            <option value="without">not containing</option>
        </select>
        <input type="text" id="searchWords" placeholder="words, e.g. rick trick">
        <input type="text" id="withTags" placeholder="with tags, e.g. urgent">
        <input type="text" id="withoutTags" placeholder="without tags, e.g. done">
        <button type="submit">Search</button>
        <button type="reset">Reset</button>
    </form>
    <ul id="list"></ul>
    <script src="script.js"></script>
</body>
</html>
